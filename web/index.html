<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#efe9d9">
  <title>WALLET</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Oswald:wght@400;500;600;700&family=Rubik+Mono+One&display=swap&subset=cyrillic,cyrillic-ext,latin,latin-ext">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    window.__appAssetVersion = String(Date.now());
    window.__withAppVersion = function (path) {
      var join = path.indexOf("?") === -1 ? "?" : "&";
      return path + join + "v=" + encodeURIComponent(window.__appAssetVersion);
    };
    window.__showBootError = function () {
      document.body.innerHTML = "<main style=\"padding:24px;font:16px system-ui\">Копійка не завантажилась. Перезапусти Mini App.</main>";
    };
    (function loadAppStyle() {
      var el = document.createElement("link");
      el.rel = "stylesheet";
      el.href = window.__withAppVersion("./src/style.css");
      document.head.appendChild(el);
    })();
    window.addEventListener("error", function (event) {
      console.error(event.error || event.message || event);
      window.__showBootError();
    });
    window.addEventListener("unhandledrejection", function (event) {
      console.error(event.reason || event);
      window.__showBootError();
    });
  </script>
</head>
<body>
  <noscript>Для роботи Копійки потрібен JavaScript.</noscript>
  <script>
    (async function () {
      try {
        var markup = await fetch(window.__withAppVersion("./src/markup.html"), { cache: "no-store" }).then(function (r) {
          if (!r.ok) throw new Error("markup: " + r.status);
          return r.text();
        });
        document.body.insertAdjacentHTML("afterbegin", markup);
        var scripts = [
          window.__withAppVersion("./config.js"),
          window.__withAppVersion("./telegram-adapter.js"),
          "./src/vendor/gsap.min.js",
          "./src/vendor/Flip.min.js",
          window.__withAppVersion("./src/anim.js"),
          window.__withAppVersion("./src/app.js")
        ];
        for (var i = 0; i < scripts.length; i++) {
          await new Promise(function (resolve, reject) {
            var el = document.createElement("script");
            el.src = scripts[i];
            el.onload = resolve;
            el.onerror = function () { reject(new Error("script: " + scripts[i])); };
            document.body.appendChild(el);
          });
        }
      } catch (err) {
        window.__showBootError();
        console.error(err);
      }
    })();
  </script>
</body>
</html>
