<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Walroo">
  <title>Walroo</title>
  <!--
    Знак кенгуру, перемальований за референсом Walroo.
    fill-rule="evenodd" тут робить три речі одним контуром:
      1) зовнішній силует заливається;
      2) підкова сумки лишається порожньою (другий підконтур);
      3) передня лапа всередині сумки знову заливається (третій підконтур,
         три перетини — непарне число).
    currentColor — щоб той самий файл був фіолетовим у шапці, білим на
    активній вкладці доку й синім у темній темі без окремих копій.
  -->
  <g fill="currentColor" fill-rule="evenodd">
    <!-- вуха -->
    <path d="M43.2 4.1c1.1-.6 1.9.5 1.9 2.1 0 3.1-1.2 7.5-2.9 9.6-.9 1.1-1.9.9-2.2-.5-.6-2.9.9-9.4 3.2-11.2z"/>
    <path d="M52.4 5.3c1.2-.4 1.9.7 1.8 2.4-.2 2.9-1.4 6.6-2.8 8.2-.8.9-1.7.6-1.9-.6-.4-2.4.6-8.8 2.9-10z"/>

    <!-- силует: голова, тулуб, задня лапа зі ступнею та хвіст -->
    <path d="M45.4 16.5c2.6-1.3 5.1-1.1 7 .4 2.6 1.3 4.8 2.8 7 4.1 2 1.1 2.9 1.9 2.5 2.8-.5 1.1-3.6 1.6-6.5 2.1-2.2.7-3.6 1.9-4 3.4 1.4 2.3 2.8 4.3 3 6.5.2 3.2-1.4 6.2-3.8 8.4-1 1-1.4 2.2-1.2 3.6.4 2.2.2 4.6-.8 6.6-.8 1.6-2.2 2.8-3.8 3.6 2.2.4 5.6.6 7.8 1.6 1 .4.8.8-.6.8H36c-1.2 0-1.4-.6-.6-1.4 1.4-1.4 2.4-3 2.8-4.8-5 1.2-11 1.4-16 .4-5-1-10-3-14-6-2.4-1.8-4.6-4-3.8-5.4.8-1.4 3.8-.6 6.2.8 4.2 2.4 9 4 13.8 4 .4-4 1.8-8 4.4-11.4 3.4-4.6 8-8.6 12.8-12.2 2-1.6 3.2-4.4 3.8-7.9z"/>

    <!-- порожнина сумки -->
    <path d="M33.6 35.2c.8-1.2 2.4-1.6 4-1.5h11.2c1.2 0 2 .8 2 2v10.4c0 1.2-.8 2-2 2H37.2c-1.6 0-3-.8-3.8-2.1-1.2-2-1.2-8.6.2-10.8z"/>

    <!-- передня лапа всередині сумки -->
    <path d="M35.9 36.9c1.2-.2 2.3.5 3.3 1.1 2.1 1.3 4.2 2.7 6.3 4 .9.6 1.9 1.2 2.4 2.2.5 1 .2 2.4-.8 2.9-.9.5-2 .1-2.9-.3-3.1-1.5-6.1-3.2-9.1-5-.8-.5-1.7-1-2.1-1.9-.4-.9 0-2 .8-2.5.6-.4 1.4-.4 2.1-.5z"/>
  </g>
</svg>
