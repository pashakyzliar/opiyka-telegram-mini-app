services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kopiyka
      POSTGRES_USER: kopiyka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kopiyka -d kopiyka"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
